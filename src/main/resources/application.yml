spring:
  lifecycle:
    timeout-per-shutdown: 60s
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      idle-timeout: 30000  # 30초 후 유휴 커넥션 닫기
      max-lifetime: 1800000  # 30분 후 커넥션 강제 갱신
      connection-timeout: 30000  # 30초 동안 커넥션을 얻지 못하면 에러 발생

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL}
      jdbc:
        time-zone: Asia/Seoul
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.generate_statistics: false #Hibernate에서 성능 통계 정보 생성 여부 (배치처리 확인용)
    show-sql: ${SPRING_JPA_SHOW_SQL}

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT}
      password: ${SPRING_REDIS_PASSWORD}

oauth:
  web-redirect-uri: ${OAUTH_WEB-REDIRECT-URI}
  app-redirect-uri: ${OAUTH_APP-REDIRECT-URI}
  kakao:
    backend-redirect-uri: ${OAUTH_KAKAO_BACKEND-REDIRECT-URI}
    client-id: ${OAUTH_KAKAO_CLIENT-ID}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
info:
  app:
    version: ${APP_VERSION:latest}

server:
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true
